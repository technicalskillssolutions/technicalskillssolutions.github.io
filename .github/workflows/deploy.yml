
name: Deploy static website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit sitemap URLs to IndexNow
        run: |
          node --input-type=module <<'NODE'
          const host = 'technicalskillssolutions.github.io';
          const key = 'a7355907ba2945ff966860b77f78a66d';
          const keyLocation = `https://${host}/${key}.txt`;
          const sitemapUrl = `https://${host}/sitemap.xml`;

          const sitemapResponse = await fetch(sitemapUrl);

          if (!sitemapResponse.ok) {
            throw new Error(`Sitemap fetch failed: ${sitemapResponse.status}`);
          }

          const xml = await sitemapResponse.text();

          const urls = [
            ...xml.matchAll(/<loc>\s*(.*?)\s*<\/loc>/g)
          ].map(match => match[1].trim());

          if (urls.length === 0) {
            throw new Error('No URLs found in sitemap.');
          }

          console.log(`Submitting ${urls.length} URLs to IndexNow.`);

          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json; charset=utf-8'
            },
            body: JSON.stringify({
              host,
              key,
              keyLocation,
              urlList: urls
            })
          });

          console.log(`IndexNow HTTP status: ${response.status}`);

          if (![200, 202].includes(response.status)) {
            throw new Error(
              `IndexNow submission failed: ${await response.text()}`
            );
          }

          console.log('IndexNow submission accepted.');
          NODE
